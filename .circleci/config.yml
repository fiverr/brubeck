version: 2.1
jobs:
  release:
    parameters:
      resource_class:
        description: "resource class type"
        default: medium
        type: string
    resource_class: << parameters.resource_class >>
    working_directory: ~/app
    machine:
      image: default
    steps:
      - checkout
      - run:
          name: Load CI Scripts
          command: |
            git clone git@github.com:fiverr/kubernetes.git /var/tmp/kubernetes
            /var/tmp/kubernetes/scripts/ci/install_fiverrci.sh
            echo "export FIVERRCI_BUILDKIT=1" >> $BASH_ENV
      - run:
          name: Prepare docker version
          command: /var/tmp/kubernetes/scripts/ci/create_version_name.sh
      - run:
          name: Docker build
          command: /var/tmp/kubernetes/scripts/ci/build_version.sh
      - run:
          name: Docker push
          command: /var/tmp/kubernetes/scripts/ci/push_version_multiarch.sh

  release_manifest:
    working_directory: ~/app
    docker:
      - image: fiverr/docker_releaser:latest
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    steps:
      - checkout
      - setup_remote_docker:
          version: docker24
      - run:
          name: Push/Publish Image Manifest
          command: |
            /var/tmp/kubernetes/scripts/ci/create_version_name.sh
            /var/tmp/kubernetes/scripts/ci/push_manifest.sh "--platform amd64 --platform arm64"
workflows:
  version: 2
  ci-cd:
    jobs:
      - release:
          matrix:
            parameters:
              resource_class:
                - medium
                - arm.medium
          context: org-global
          filters:
            branches:
              only:
                - master
                - /.*_rc/

      - release_manifest:
          context: org-global
          requires:
            - release
